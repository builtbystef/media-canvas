<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The render worker image's whole font configuration (issue 6sfpv3, ADR-0002).

  It replaces /etc/fonts/fonts.conf, and it deliberately does not include
  /etc/fonts/conf.d: the distro cascade adds font directories, generic-family
  aliases and metric substitutions, and every one of those is a way for a face
  nobody pinned to reach a render.

  The one directory below holds the bundled font set (packages/fonts), so
  fc-list inside the image returns those files and nothing else. Compiled
  markup carries its own faces inline as @font-face data URIs, so the render
  path never asks fontconfig for a family at all; this file exists to make sure
  that when something does ask, there is no unpinned face to answer with.
-->
<fontconfig>
  <dir>/srv/media-canvas/packages/fonts/files</dir>
  <cachedir>/var/cache/fontconfig</cachedir>
</fontconfig>
