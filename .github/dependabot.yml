version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Mirrors pnpm's minimumReleaseAge (5760 min): don't propose versions younger than 4 days.
    cooldown:
      default-days: 4
    ignore:
      # 2.x ships no "exports" map (Node gets the CommonJS build without named
      # exports) and measures text differently; upgrading is a migration, not a bump.
      - dependency-name: opentype.js
        update-types: ["version-update:semver-major"]
    groups:
      # vite-plus and vite need a manual bump together. See: pnpm-workspace.yaml
      vite-plus:
        patterns: ["vite", "vite-plus", "@voidzero-dev/vite-plus-core"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 4

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
