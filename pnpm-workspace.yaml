packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  # Pinned exact to the version Vite+ bundles: a second Vitest in the graph
  # is two test runners. Bump it with vite-plus, not on its own.
  vitest: 4.1.11
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  "@types/opentype.js": ^1.3.10
  playwright-core: 1.62.1
  "@playwright/test": ^1.62.1
  opentype.js: ^2.0.0
  zod: ^4.4.3
  zustand: ^5.0.15
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4.3.3
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  "@base-ui/react": ^1.7.0
  lucide-react: ^1.33.0
  shadcn: ^4.18.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAge: 5760

strictDepBuilds: true
allowBuilds: { sharp: true }

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver

verifyDepsBeforeRun: install

engineStrict: true
