services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: media_canvas
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set it in .env, copied from .env.example}"
      POSTGRES_DB: media_canvas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.dev/run/pg:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_canvas -d media_canvas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    command:
      ["redis-server", "--unixsocket", "/var/run/redis/redis.sock", "--unixsocketperm", "777"]
    volumes:
      - ./.dev/run/redis:/var/run/redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-access-key
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_DEFAULT_ACCESS_KEY:?set it in .env, copied from .env.example}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY:?set it in .env, copied from .env.example}"
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?set it in .env, copied from .env.example}"
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./infra/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set it in .env, copied from .env.example}"
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_DEFAULT_ACCESS_KEY:?set it in .env, copied from .env.example}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY:?set it in .env, copied from .env.example}"
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_REGION: "${STORAGE_REGION:-garage}"
      ASSETS_BUCKET: "${ASSETS_BUCKET:-media-canvas-assets}"
      OUTPUTS_BUCKET: "${OUTPUTS_BUCKET:-media-canvas-outputs}"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?set it in .env, copied from .env.example}"
      WORKER_INTERNAL_HOST: worker
      WORKER_INTERNAL_PORT: "${WORKER_INTERNAL_PORT:-4000}"
      REDIS_HOST: redis
      DOMAIN: "${DOMAIN:-}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      MAILER: "${MAILER:-console}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  worker:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:?set it in .env, copied from .env.example}"
      WORKER_INTERNAL_PORT: "${WORKER_INTERNAL_PORT:-4000}"
      API_INTERNAL_URL: http://api:8000
      REDIS_HOST: redis
      GARAGE_DEFAULT_ACCESS_KEY: "${GARAGE_DEFAULT_ACCESS_KEY:?set it in .env, copied from .env.example}"
      GARAGE_DEFAULT_SECRET_KEY: "${GARAGE_DEFAULT_SECRET_KEY:?set it in .env, copied from .env.example}"
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_REGION: "${STORAGE_REGION:-garage}"
      OUTPUTS_BUCKET: "${OUTPUTS_BUCKET:-media-canvas-outputs}"
    depends_on:
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy
      api:
        condition: service_started

  caddy:
    profiles: [app]
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${DOMAIN:-http://:80}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  garage-data:
  caddy-data:
