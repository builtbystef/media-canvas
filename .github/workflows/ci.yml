name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Reads the pinned version from package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec vp check
      - run: pnpm exec vp test
      - run: pnpm --filter web --filter @media-canvas/api-client run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      # --all-packages installs the workspace members (apps/api) too; the root
      # project is virtual and carries only the shared dev toolchain.
      - run: uv sync --locked --all-packages

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check

      # The api's tests run against a real Postgres and a real object store —
      # the ones the compose file starts in development. The example leaves
      # required values empty, and compose interpolates the whole file even
      # for a single service, so the placeholders stand in for the ones this
      # job never starts. Garage checks its own two secrets, so those are
      # generated instead: it rejects a secret key shorter than 16 characters,
      # and an RPC secret that is not 32 bytes of hex.
      - run: |
          sed -E 's/^([A-Z][A-Z0-9_]*)=$/\1=ci-placeholder/' .env.example > .env
          {
            echo "GARAGE_DEFAULT_SECRET_KEY=$(openssl rand -hex 16)"
            echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
          } >> .env
      - run: docker compose up -d --wait postgres garage

      - run: uv run pytest

  # The committed openapi.json and generated client must match the FastAPI app.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --all-packages

      - run: pnpm --filter api run build
      - run: pnpm --filter @media-canvas/api-client run build
      - run: git diff --exit-code

  # The compose file must parse, and must not read a variable that .env.example
  # does not define.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The example leaves required values empty; validation only needs them
      # set. A variable the example does not define stays unset, and compose
      # refuses it.
      - run: sed -E 's/^([A-Z][A-Z0-9_]*)=$/\1=ci-placeholder/' .env.example > "$RUNNER_TEMP/.env"

      # `--profile "*"` validates the services of every profile, not only the
      # default one.
      - run: docker compose --env-file "$RUNNER_TEMP/.env" --profile "*" config --quiet
