services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: media_canvas
      POSTGRES_PASSWORD: media_canvas
      POSTGRES_DB: media_canvas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
