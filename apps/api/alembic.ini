# Alembic's command line: `uv run alembic revision --autogenerate -m "..."`
# from apps/api. The api itself does not read this file — it builds the same
# configuration from the installed package (media_canvas_api.migrator), and
# the database URL comes from the settings in both cases.
[alembic]
script_location = src/media_canvas_api/migrations
prepend_sys_path = src
