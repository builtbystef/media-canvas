[project]
name = "media-canvas-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pillow>=12.3.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.32",
  "resend>=2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.8,<1"]
build-backend = "uv_build"
