[project]
name = "media-canvas-api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = ["httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.12.3,<1"]
build-backend = "uv_build"
